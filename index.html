<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEAK 제품 가격 검색</title>
    <!-- Bootstrap CSS CDN for responsive design -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4 text-center">MEAK 제품 가격 검색 <small class="text-muted" style="font-size: 0.5em; margin-left: 20px; float: right;">made by 알프</small></h1>

        <div class="alert alert-info d-flex flex-column flex-sm-row justify-content-between align-items-sm-center mb-4" role="alert">
            <div>
                <strong>가격표 기준일: 2026-05-15</strong>
                <span class="d-block d-sm-inline ms-sm-2">PLC 품목 147건 가격 변경, 신규 57건 추가 반영</span>
            </div>
            <span class="badge bg-primary mt-2 mt-sm-0">UPDATED</span>
        </div>

        <div class="input-group mb-4">
            <input type="text" id="searchInput" class="form-control" placeholder="제품 규격 검색 (예: CPU)">
            <button class="btn btn-primary" id="searchButton">검색</button>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>구분</th>
                        <th>규격</th>
                        <th>변경전 가격</th>
                        <th>변경후 가격</th>
                        <th class="price-5">-5%</th>
                        <th class="price-10">-10%</th>
                        <th class="price-15">-15%</th>
                    </tr>
                </thead>
                <tbody id="resultsTableBody">
                    <!-- Search results will be inserted here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
